version: "1.0"
enforcement_mode: "STRICT_BLOCK"
max_latency_sla_ns: 250

tool_governance:
  permitted_read_tools:
    - "read_holding_registers"
    - "read_discrete_inputs"
    - "get_plant_temperature"
    - "query_pmu_vibration"
    - "get_scada_alarms"
    - "summarize_maintenance_logs"
  blocked_physical_tools:
    - "write_single_coil"
    - "write_multiple_registers"
    - "s7_plc_cpu_stop"
    - "set_valve_position"
    - "emergency_shutdown_override"

prompt_firewall:
  block_system_delimiters: true
  block_jailbreak_templates: true
  block_indirect_sensor_injections: true
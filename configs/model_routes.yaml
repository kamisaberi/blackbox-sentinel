version: "2.0"

global_policy:
  short_circuit_on_kernel_drop: true
  max_pipeline_latency_budget_us: 1000
  default_xinfer_backend: "INTEL_OPENVINO"
  fallback_xinfer_backend: "CPU_AVX512"

routes:
  - sensor_id: "sensor_nic_10gbe_lan0"
    sensor_type: "NETWORK_INTERFACE"
    driver_binding:
      mode: "AF_XDP_UMEM"
      interface: "eth0"
      rx_queue: 0

    traffic_rules:
      - match:
          transport: "tcp"
          port: 443
        spkg_prefilter:
          active_packages:
            - package_id: "org.aryorithm.package.http_rapid_reset"
              action_on_match: "IMMEDIATE_EBPF_DROP"
        dissector_plugin:
          plugin_id: "tls_ja4_dissector_plugin.so"
          emits_event: "SECURITY_EVENT_TLS_FLOW"
          feature_dimension: 32
        subsystem_pipeline:
          owner_subsystem: "03_ndr"
          execution_mode: "CASCADE_SHORT_CIRCUIT"
          model_stages:
            - model_id: "aryo-netflow-mae-v2"
              format: "ONNX"
              precision: "INT8"
              silicon_target: "INTEL_NPU"
              latency_budget_ns: 75000
              threshold_drop: 0.92
            - model_id: "aryo-ja4-c2-transformer-v1"
              format: "ONNX"
              precision: "FP16"
              silicon_target: "NVIDIA_GPU"
              latency_budget_ns: 95000
              threshold_drop: 0.85
              xai_explainer: "MRD_XAI"

      - match:
          transport: "tcp"
          port: 502
        spkg_prefilter:
          active_packages:
            - package_id: "org.aryorithm.package.modbus_actuator_guard"
              action_on_match: "IMMEDIATE_EBPF_DROP"
        dissector_plugin:
          plugin_id: "scada_modbus_plugin.so"
          emits_event: "SECURITY_EVENT_SCADA_CMD"
          feature_dimension: 16
        subsystem_pipeline:
          owner_subsystem: "18_cps_sec"
          model_stages:
            - model_id: "aryo-scada-kinematic-v1"
              format: "ONNX"
              precision: "FP16"
              silicon_target: "INTEL_NPU"
              latency_budget_ns: 110000
              threshold_drop: 0.88
              xai_explainer: "MRD_XAI"

      - match:
          transport: "tcp"
          port: 102
        spkg_prefilter:
          active_packages:
            - package_id: "org.aryorithm.package.s7comm_safety_interlock"
              action_on_match: "IMMEDIATE_EBPF_DROP"
        dissector_plugin:
          plugin_id: "s7comm_opcua_plugin.so"
          emits_event: "SECURITY_EVENT_PLC_TELEMETRY"
          feature_dimension: 24
        subsystem_pipeline:
          owner_subsystem: "18_cps_sec"
          model_stages:
            - model_id: "aryo-scada-kinematic-v1"
              silicon_target: "INTEL_NPU"

  - sensor_id: "sensor_thermal_cam_substation_01"
    sensor_type: "OPTICAL_THERMAL"
    driver_binding:
      mode: "RTSP_STREAM"
      endpoint: "rtsp://10.240.0.60:8554/thermal_transformer"
    dissector_plugin:
      plugin_id: "rtsp_vision_correlator_plugin.so"
      emits_event: "SECURITY_EVENT_THERMAL_FRAME"
      feature_dimension: 64
    subsystem_pipeline:
      owner_subsystem: "18_cps_sec"
      model_stages:
        - model_id: "aryo-thermal-heat-spike-v1"
          format: "ONNX"
          precision: "FP16"
          silicon_target: "INTEL_NPU"
          latency_budget_ns: 120000

cross_modal_correlations:
  - correlation_id: "FUSION-SCADA-THERMAL-DISCREPANCY"
    description: "Detects spoofed normal Modbus status while physical transformer is overheating."
    participating_subsystems:
      - "18_cps_sec"
    time_window_ms: 500
    condition:
      cyber_sensor_id: "sensor_nic_10gbe_lan0"
      cyber_max_score: 0.20
      physical_sensor_id: "sensor_thermal_cam_substation_01"
      physical_min_temp: 120.0
    action: "EMERGENCY_PHYSICAL_ISOLATION"
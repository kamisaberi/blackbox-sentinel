services:
  # =========================================================================
  # 1. SIMULATED ENTERPRISE CLIENTS (TELEMETRY GENERATORS)
  # =========================================================================

  # Linux Web Server Cluster
  sim-ubuntu-web-cluster:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq rsyslog net-tools curl netcat-openbsd && rm -rf /var/lib/apt/lists/*
    container_name: sim-ubuntu-web-cluster
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.10
    command: >
      sh -c "echo '*.* @172.30.0.1:514' >> /etc/rsyslog.conf &&
             rsyslogd &&
             logger 'Simulated Ubuntu Web Cluster Online - Streaming Syslog' &&
             sleep infinity"

  # Windows Domain Controller Simulator
  sim-windows-dc:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq rsyslog curl && rm -rf /var/lib/apt/lists/*
    container_name: sim-windows-dc
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.11
    command: >
      sh -c "echo '*.* @172.30.0.1:514' >> /etc/rsyslog.conf &&
             rsyslogd &&
             logger 'EventID: 4625 - Failed Logon attempt for domain administrator' &&
             sleep infinity"

  # SCADA Industrial Modbus PLC #1 (Siemens S7 Emulation)
  sim-modbus-plc-1:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        RUN pip install --no-cache-dir pymodbus
    container_name: sim-modbus-plc-1
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.20
    command: >
      python3 -c "from pymodbus.server import StartTcpServer; print('Modbus PLC #1 Active'); StartTcpServer(context=None, address=('0.0.0.0', 502))"

  # SCADA Industrial Modbus PLC #2 (Allen-Bradley Emulation)
  sim-modbus-plc-2:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        RUN pip install --no-cache-dir pymodbus
    container_name: sim-modbus-plc-2
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.21
    command: >
      python3 -c "from pymodbus.server import StartTcpServer; print('Modbus PLC #2 Active'); StartTcpServer(context=None, address=('0.0.0.0', 502))"

  # Electrical Grid Substation DNP3 Simulator
  sim-dnp3-substation:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq netcat-openbsd curl && rm -rf /var/lib/apt/lists/*
    container_name: sim-dnp3-substation
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.22
    command: sleep infinity

  # RTSP HD Camera #1
  sim-rtsp-camera-1:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq netcat-openbsd curl && rm -rf /var/lib/apt/lists/*
    container_name: sim-rtsp-camera-1
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.30
    command: sleep infinity

  # RTSP HD Camera #2
  sim-rtsp-camera-2:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq netcat-openbsd curl && rm -rf /var/lib/apt/lists/*
    container_name: sim-rtsp-camera-2
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.31
    command: sleep infinity

  # 100x IoT Smart Meters Telemetry Cluster
  sim-iot-smart-meters:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq curl && rm -rf /var/lib/apt/lists/*
    container_name: sim-iot-smart-meters
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.40
    command: sleep infinity

  # =========================================================================
  # 2. SIMULATED MULTI-VECTOR ATTACKER NODES (PRE-ARMED TOOLS)
  # =========================================================================

  # Attacker Node 1: High-Throughput DDoS & Packet Flood Generator
  sim-attacker-ddos:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq hping3 iperf3 nmap curl netcat-openbsd && rm -rf /var/lib/apt/lists/*
    container_name: sim-attacker-ddos
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.250
    command: sleep infinity

  # Attacker Node 2: Industrial SCADA PLC Sabotage Generator
  sim-attacker-scada:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        RUN apt-get update -qq && apt-get install -y -qq netcat-openbsd curl && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir pymodbus
    container_name: sim-attacker-scada
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.251
    command: sleep infinity

  # Attacker Node 3: High-Concurrency Brute Force & Exploit Engine
  sim-attacker-bruteforce:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:22.04
        ENV DEBIAN_FRONTEND=noninteractive
        RUN apt-get update -qq && apt-get install -y -qq hydra nmap curl netcat-openbsd && rm -rf /var/lib/apt/lists/*
    container_name: sim-attacker-bruteforce
    networks:
      sentinel_massive_net:
        ipv4_address: 172.30.0.252
    command: sleep infinity

networks:
  sentinel_massive_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16